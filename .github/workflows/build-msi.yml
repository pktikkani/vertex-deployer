name: Build MSI Installer

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'WSMDeployer/WSMDeployer.csproj'
  INSTALLER_PATH: 'WSMDeployerInstaller'

jobs:
  build-msi:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Publish application
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          --output WSMDeployer/bin/Release/net8.0/win-x64/publish `
          -p:PublishSingleFile=false `
          -p:PublishReadyToRun=false

    - name: Verify publish output
      run: |
        Write-Host "Checking publish directory..."
        Get-ChildItem -Path "WSMDeployer/bin/Release/net8.0/win-x64/publish" -Recurse | Select-Object FullName
        $fileCount = (Get-ChildItem -Path "WSMDeployer/bin/Release/net8.0/win-x64/publish" -File).Count
        Write-Host "Total files: $fileCount"
        if ($fileCount -lt 10) {
          throw "Publish directory has too few files. Build may have failed."
        }
      shell: pwsh

    - name: Install WiX Toolset
      run: |
        dotnet tool install --global wix
        wix extension add -g WixToolset.UI.wixext

    - name: Generate WXS file
      run: |
        cd ${{ env.INSTALLER_PATH }}
        .\GenerateWXS.ps1 -SourceDir "../WSMDeployer/bin/Release/net8.0/win-x64/publish"
      shell: pwsh

    - name: Build MSI
      run: |
        cd ${{ env.INSTALLER_PATH }}

        # Create bin directory if it doesn't exist
        if (-not (Test-Path "bin")) {
          New-Item -ItemType Directory -Path "bin" | Out-Null
        }

        Write-Host "Building MSI with WiX UI extension..."
        wix build `
          -arch x64 `
          -ext WixToolset.UI.wixext `
          -d DeployerDir="../WSMDeployer/bin/Release/net8.0/win-x64/publish" `
          Product.wxs `
          Generated.wxs `
          -out bin/VertexCentralDeployer.msi

        if ($LASTEXITCODE -eq 0) {
          Write-Host "MSI built successfully!"
        }
        else {
          throw "MSI build failed with exit code: $LASTEXITCODE"
        }
      shell: pwsh

    - name: Verify MSI created
      run: |
        $msiPath = "${{ env.INSTALLER_PATH }}/bin/VertexCentralDeployer.msi"
        if (-not (Test-Path $msiPath)) {
          throw "MSI file not found at $msiPath"
        }
        $msiSize = (Get-Item $msiPath).Length / 1MB
        Write-Host "MSI created successfully: $([math]::Round($msiSize, 2)) MB"
      shell: pwsh

    - name: Upload MSI artifact
      uses: actions/upload-artifact@v4
      with:
        name: VertexCentralDeployer-MSI
        path: ${{ env.INSTALLER_PATH }}/bin/VertexCentralDeployer.msi
        retention-days: 30

    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.INSTALLER_PATH }}/bin/VertexCentralDeployer.msi
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
