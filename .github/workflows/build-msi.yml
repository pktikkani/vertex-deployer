name: Build MSI Installer

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-msi:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install WiX Toolset
      run: |
        dotnet tool install --global wix
        wix extension add -g WixToolset.UI.wixext
        wix extension add -g WixToolset.Util.wixext

    - name: Build MSI Installer
      run: |
        pwsh -ExecutionPolicy Bypass -File WSMDeployerInstaller/BuildMSI.ps1
      shell: pwsh

    - name: Upload MSI artifact
      uses: actions/upload-artifact@v4
      with:
        name: VertexCentralDeployer-MSI
        path: WSMDeployerInstaller/bin/VertexCentralDeployer.msi
        retention-days: 30

    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: WSMDeployerInstaller/bin/VertexCentralDeployer.msi
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
